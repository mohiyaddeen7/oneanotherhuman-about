name: Verify public overview

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify feature-map contract
        run: node tests/overview-contract.mjs
      - name: Verify selected warm photo-led design
        run: node tests/warm-photo-led-contract.mjs
      - name: Verify responsive breakpoints and unique photography
        run: node tests/mobile-responsive-contract.mjs
      - name: Verify screenshot-driven mobile composition
        run: node tests/mobile-composition-contract.mjs
      - name: Verify how-it-works visual rail
        run: node tests/how-it-works-rail-contract.mjs
      - name: Verify calm hero
        run: node tests/calm-hero-contract.mjs
